[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virel-budget"
version = "1.0.0"
description = "Reliability-constrained visual-token budgeting for green vision-language inference."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Sean Wan"},
    {name = "Shilin Ou"},
    {name = "Luyao Zhang"},
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/StableTradeAtlas/ViRel-Budget"
Repository = "https://github.com/StableTradeAtlas/ViRel-Budget"
Issues = "https://github.com/StableTradeAtlas/ViRel-Budget/issues"

[project.optional-dependencies]
model = [
    "torch>=2.3",
    "transformers>=4.50",
    "accelerate>=0.30",
    "codecarbon==3.2.9",
]
research = [
    "torch>=2.3",
    "transformers>=4.50",
    "datasets>=2.19",
    "accelerate>=0.30",
    "codecarbon==3.2.9",
]
plot = [
    "matplotlib>=3.8",
]
test = []

[project.scripts]
virel-budget = "virel_budget.cli:main"

[tool.setuptools.packages.find]
include = ["virel_budget*"]
